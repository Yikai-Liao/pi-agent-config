# Pi loads TypeScript entries through node_modules paths; use a flat layout
# so their transitive dependencies resolve from those paths.
nodeLinker: hoisted
allowBuilds:
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  sharp: false
overrides:
  '@earendil-works/pi-ai': 0.85.1
  '@earendil-works/pi-coding-agent': 0.85.1
  '@earendil-works/pi-tui': 0.85.1
