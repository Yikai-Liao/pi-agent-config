name: Pi package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/check-pi-package.py

  auto-merge:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify auto-merge is enabled
        if: github.event_name == 'workflow_dispatch'
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .allow_auto_merge)" = true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Enable auto-merge
        if: github.event_name == 'pull_request'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
